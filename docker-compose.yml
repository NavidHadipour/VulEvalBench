# =============================================================================
# VulEvalBench -- container orchestration.
#
#   docker compose up --build      start (rebuilding after code changes)
#   docker compose logs -f         follow pipeline output
#   docker compose down            stop and remove the container
#
# Then open http://localhost:8000
#
# IMPORTANT -- Ollama runs on the HOST, not in this container.
#   The generator model needs several gigabytes of weights and benefits from
#   host GPU access, so it is not containerised. The container reaches it over
#   host.docker.internal (see OLLAMA_BASE_URL below).
#
#   On the host, Ollama must listen on more than loopback for the container to
#   reach it:
#       Windows/macOS : set the environment variable OLLAMA_HOST=0.0.0.0 and
#                       restart Ollama
#       Linux         : same, plus keep the extra_hosts line below
# =============================================================================

services:
  vulevalbench:
    build: .
    container_name: vulevalbench

    # Published on the loopback interface only. Binding "8000:8000" would expose
    # the interface on every network the host is attached to -- and this app has
    # no authentication and holds API keys. The container itself still listens
    # on 0.0.0.0, which is required for Docker to forward the port; the
    # restriction belongs here.
    ports:
      - "127.0.0.1:8000:8000"

    environment:
      # Where the containerised app looks for the host's Ollama server.
      # config.OLLAMA_BASE_URL reads this when set.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

    # host.docker.internal resolves automatically on Docker Desktop but not on
    # native Linux, where this maps it to the host gateway explicitly.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Credentials, mounted read-only at run time rather than copied into the
      # image, so they never enter a layer that could be pushed to a registry --
      # a secret in a layer persists in the image history even if a later layer
      # deletes it.
      #
      # The judgment file is required; the Anthropic one is optional. Comment
      # out the second line if you have no api-key-llm.txt.
      - ./api-key-judgment.txt:/app/api-key-judgment.txt:ro
      - ./api-key-llm.txt:/app/api-key-llm.txt:ro

      # Runs and logs live on the host, so results survive `docker compose
      # down`, can be inspected in an editor, and can be shared without
      # extracting them from a container.
      - ./runs:/app/runs
      - ./logs:/app/logs
      - ./ingested:/app/ingested

    # A full run takes minutes; without this, stopping the container mid-run
    # would kill it after the default 10 second grace period.
    stop_grace_period: 60s
